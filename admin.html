<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лесовик — Панель управления</title>
    
    <!-- Место для вашего будущего фавикона (иконки вкладки) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌲</text></svg>">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Inter:wght@400;500;600&display=swap');

        :root {
            /* Светлая тема */
            --bg-color: #F9FBF9;
            --text-color: #333333;
            --accent-primary: #2D5A27;
            --accent-secondary: #8FBC8F;
            --accent-light: #E3F2FD;
            --card-bg: #FFFFFF;
            --border-color: #E0E0E0;
            --input-bg: #FFFFFF;
            --glass-bg: rgba(249, 251, 249, 0.85);
            --glass-border: rgba(45, 90, 39, 0.1);
            --radius-strict: 2px; /* Строгие углы по ТЗ */
        }

        [data-theme="dark"] {
            /* Темная тема */
            --bg-color: #1A2421;
            --text-color: #F9FBF9;
            --accent-primary: #8FBC8F;
            --accent-secondary: #2D5A27;
            --accent-light: #2A3B32;
            --card-bg: #22302B;
            --border-color: #3A4F46;
            --input-bg: #1A2421;
            --glass-bg: rgba(26, 36, 33, 0.85);
            --glass-border: rgba(143, 188, 143, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Плавающая стеклянная шапка */
        .glass-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            transition: background 0.3s, border-color 0.3s;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Заглушка для векторного логотипа (силуэт ели) */
        .logo-svg {
            width: 28px;
            height: 28px;
            fill: var(--accent-primary);
            transition: fill 0.3s;
        }

        .glass-header h1 {
            font-family: 'Merriweather', serif;
            color: var(--accent-primary);
            margin: 0;
            font-size: 22px;
            letter-spacing: 0.5px;
            transition: color 0.3s;
        }

        .theme-toggle {
            background: transparent;
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
            padding: 10px 20px;
            border-radius: var(--radius-strict);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-toggle:hover {
            background-color: var(--accent-primary);
            color: var(--bg-color);
        }

        /* Бенто-сетка со строгими формами */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .bento-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-strict);
            padding: 24px;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.3s, border-color 0.3s;
        }

        .bento-card:hover {
            box-shadow: 4px 4px 0px rgba(0,0,0,0.05); /* Жесткая инженерная тень */
        }

        .span-2 {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        label {
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent-primary);
            transition: color 0.3s;
        }

        input, textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-strict);
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 15px;
            transition: border-color 0.2s, background-color 0.3s, color 0.3s;
            flex-grow: 1;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: inset 2px 2px 0px rgba(0,0,0,0.05);
        }

        textarea {
            min-height: 250px;
            resize: vertical;
        }

        /* Строгая прямоугольная кнопка */
        .button-submit {
            background-color: var(--accent-primary);
            color: var(--bg-color);
            border: none;
            padding: 16px 32px;
            border-radius: var(--radius-strict);
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.2s, transform 0.1s, color 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .button-submit:hover {
            background-color: var(--text-color); /* Меняет цвет на контрастный при наведении */
            color: var(--bg-color);
        }

        .button-submit:active {
            transform: translateY(2px);
        }

        #status {
            margin-top: 16px;
            padding: 16px;
            display: none;
            border-radius: var(--radius-strict);
            font-weight: 500;
            text-align: center;
            font-size: 14px;
        }

        .status-success { background-color: var(--accent-light); color: var(--accent-primary); border: 1px solid var(--accent-secondary); }
        .status-error { background-color: #FEE2E2; color: #991B1B; border: 1px solid #F87171; }
        .status-loading { background-color: var(--border-color); color: var(--text-color); }

        /* Мобильная адаптация */
        @media (max-width: 768px) {
            .bento-grid { grid-template-columns: 1fr; }
            .span-2 { grid-column: span 1; }
            .glass-header { padding: 15px 20px; }
            .theme-toggle span { display: none; } /* На мобильном оставляем только иконку на кнопке */
        }
    </style>
</head>
<body>

<header class="glass-header">
    <div class="logo-container">
        <!-- Векторная иконка дерева -->
        <svg class="logo-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L1 21H23L12 2ZM12 6.88L18.17 17.5H5.83L12 6.88Z"/>
            <rect x="10.5" y="20" width="3" height="4"/>
        </svg>
        <h1>Лесовик</h1>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">Включить тень 🌙</button>
</header>

<main class="bento-grid">
    <div class="bento-card">
        <div class="form-group">
            <label>Основной заголовок</label>
            <input type="text" id="title" placeholder="Особенности таксации...">
        </div>
    </div>

    <div class="bento-card">
        <div class="form-group">
            <label>Адрес страницы (slug)</label>
            <input type="text" id="slug" placeholder="taksaciya-lesov">
        </div>
    </div>

    <div class="bento-card span-2">
        <div class="form-group">
            <label>Текст статьи (HTML-разметка)</label>
            <textarea id="content" placeholder="<p>Введение в тему...</p>"></textarea>
        </div>
    </div>

    <div class="bento-card">
        <div class="form-group">
            <label>Ссылка на фото (Object Storage)</label>
            <input type="text" id="cover" placeholder="https://storage.yandexcloud.net/...">
        </div>
    </div>

    <div class="bento-card">
        <div class="form-group" style="justify-content: flex-end;">
            <button class="button-submit" onclick="sendData()">Опубликовать материал</button>
            <div id="status"></div>
        </div>
    </div>
</main>

<script>
    // ВАЖНО: ЗАМЕНИТЕ НА ВАШУ ССЫЛКУ ИЗ ОБЛАКА
    const API_URL = 'https://functions.yandexcloud.net/d4ecn5ag33dcdd2deivd';

    function toggleTheme() {
        const body = document.documentElement;
        const btn = document.getElementById('themeBtn');
        
        if (body.getAttribute('data-theme') === 'dark') {
            body.removeAttribute('data-theme');
            btn.innerHTML = 'Включить тень 🌙';
        } else {
            body.setAttribute('data-theme', 'dark');
            btn.innerHTML = 'Включить свет ☀️';
        }
    }

    async function sendData() {
        const statusDiv = document.getElementById('status');
        const data = {
            title: document.getElementById('title').value,
            slug: document.getElementById('slug').value,
            content: document.getElementById('content').value,
            cover_image_url: document.getElementById('cover').value,
            is_published: true
        };

        statusDiv.style.display = 'block';
        statusDiv.className = 'status-loading';
        statusDiv.innerText = 'Подключение к YDB...';

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify(data)
            });

            const result = await response.json();
            
            if (result.status === 'success') {
                statusDiv.className = 'status-success';
                statusDiv.innerText = 'Материал успешно загружен в базу.';
                
                document.getElementById('title').value = '';
                document.getElementById('slug').value = '';
                document.getElementById('content').value = '';
                document.getElementById('cover').value = '';
            } else {
                throw new Error(result.error);
            }
        } catch (error) {
            statusDiv.className = 'status-error';
            statusDiv.innerText = 'Системная ошибка: ' + error.message;
        }
    }
</script>

</body>
</html>
