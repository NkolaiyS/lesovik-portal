<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лесовик — Панель управления</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌲</text></svg>">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Inter:wght@400;500;600&display=swap');

        :root {
            --bg-color: #F9FBF9;
            --text-color: #333333;
            --accent-primary: #2D5A27;
            --accent-secondary: #8FBC8F;
            --accent-light: #E3F2FD;
            --card-bg: #FFFFFF;
            --border-color: #E0E0E0;
            --input-bg: #FFFFFF;
            --glass-bg: rgba(249, 251, 249, 0.85);
            --glass-border: rgba(45, 90, 39, 0.1);
            --radius-strict: 8px; 
            --danger-color: #DC2626;
        }

        [data-theme="dark"] {
            --bg-color: #1A2421;
            --text-color: #F9FBF9;
            --accent-primary: #8FBC8F;
            --accent-secondary: #2D5A27;
            --accent-light: #2A3B32;
            --card-bg: #22302B;
            --border-color: #3A4F46;
            --input-bg: #1A2421;
            --glass-bg: rgba(26, 36, 33, 0.85);
            --glass-border: rgba(143, 188, 143, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .glass-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            transition: background 0.3s, border-color 0.3s;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-svg {
            width: 28px;
            height: 28px;
            fill: var(--accent-primary);
            transition: fill 0.3s;
        }

        .glass-header h1 {
            font-family: 'Merriweather', serif;
            color: var(--accent-primary);
            margin: 0;
            font-size: 22px;
            letter-spacing: 0.5px;
            transition: color 0.3s;
        }

        .theme-toggle {
            background: transparent;
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
            padding: 10px 20px;
            border-radius: var(--radius-strict);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-toggle:hover {
            background-color: var(--accent-primary);
            color: var(--bg-color);
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .bento-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-strict);
            padding: 24px;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.3s, border-color 0.3s;
        }

        .bento-card:hover {
            box-shadow: 4px 4px 0px rgba(0,0,0,0.05);
        }

        .span-2 { grid-column: span 2; }

        .form-group {
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: center;
        }

        label {
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent-primary);
            transition: color 0.3s;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-strict);
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 15px;
            transition: border-color 0.2s, background-color 0.3s, color 0.3s;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: inset 2px 2px 0px rgba(0,0,0,0.05);
        }

        input[readonly] {
            background-color: var(--bg-color);
            color: #888;
            cursor: not-allowed;
            margin-top: 10px;
        }

        /* Стилизация кнопки загрузки файла */
        input[type="file"] {
            display: none;
        }
        
        .file-upload-btn {
            background-color: var(--input-bg);
            border: 1px dashed var(--accent-primary);
            color: var(--accent-primary);
            padding: 14px 16px;
            text-align: center;
            border-radius: var(--radius-strict);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .file-upload-btn:hover {
            background-color: var(--accent-light);
        }

        textarea {
            min-height: 250px;
            resize: vertical;
        }

        .button-submit, .button-load {
            background-color: var(--accent-primary);
            color: var(--bg-color);
            border: none;
            padding: 16px 32px;
            border-radius: var(--radius-strict);
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.2s, transform 0.1s, color 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .button-load {
            background-color: transparent;
            color: var(--accent-primary);
            border: 1px solid var(--accent-primary);
            padding: 10px 20px;
            font-size: 14px;
            letter-spacing: normal;
        }

        .button-submit:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        .button-submit:active {
            transform: translateY(2px);
        }

        /* Стили для списка статей */
        .article-list {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .article-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-strict);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .article-title {
            font-weight: 500;
            font-size: 15px;
            color: var(--text-color);
        }

        .btn-delete {
            background-color: #FEE2E2;
            color: var(--danger-color);
            border: 1px solid #F87171;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        
        .btn-delete:hover { 
            background-color: var(--danger-color); 
            color: #fff; 
        }

        #status {
            margin-top: 16px;
            padding: 16px;
            display: none;
            border-radius: var(--radius-strict);
            font-weight: 500;
            text-align: center;
            font-size: 14px;
        }

        .status-success { background-color: var(--accent-light); color: var(--accent-primary); border: 1px solid var(--accent-secondary); }
        .status-error { background-color: #FEE2E2; color: #991B1B; border: 1px solid #F87171; }
        .status-loading { background-color: var(--border-color); color: var(--text-color); }

        @media (max-width: 768px) {
            .bento-grid { grid-template-columns: 1fr; }
            .span-2 { grid-column: span 1; }
            .glass-header { padding: 15px 20px; }
            .theme-toggle span { display: none; }
        }
    </style>
</head>
<body>

<header class="glass-header">
    <div class="logo-container">
        <svg class="logo-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L1 21H23L12 2ZM12 6.88L18.17 17.5H5.83L12 6.88Z"/>
            <rect x="10.5" y="20" width="3" height="4"/>
        </svg>
        <h1>Лесовик</h1>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">Включить тень 🌙</button>
</header>

<main class="bento-grid">
    <!-- Шаг 1. Основные тексты -->
    <div class="bento-card">
        <div class="form-group">
            <label>Основной заголовок</label>
            <input type="text" id="title" placeholder="Особенности таксации...">
        </div>
    </div>

    <div class="bento-card">
        <div class="form-group">
            <label>Адрес страницы (slug)</label>
            <input type="text" id="slug" placeholder="taksaciya-lesov">
        </div>
    </div>

    <div class="bento-card span-2">
        <div class="form-group">
            <label>Текст статьи (HTML-разметка)</label>
            <textarea id="content" placeholder="<p>Введение в тему...</p>"></textarea>
        </div>
    </div>

    <!-- Шаг 2. Загрузка медиа -->
    <div class="bento-card">
        <div class="form-group">
            <label>Обложка статьи</label>
            <label for="file-upload" class="file-upload-btn" id="upload-label">📁 Выбрать фото на компьютере</label>
            <input type="file" id="file-upload" accept="image/*" onchange="handleFileSelect(event)">
            <input type="text" id="cover" placeholder="Ссылка на фото появится здесь..." readonly>
        </div>
    </div>

    <div class="bento-card">
        <div class="form-group">
            <label>Код видео (Rutube iFrame)</label>
            <input type="text" id="rutube" placeholder='<iframe src="https://rutube.ru/..." ...></iframe>'>
        </div>
    </div>

    <!-- Шаг 3. Публикация -->
    <div class="bento-card span-2">
        <div class="form-group">
            <button class="button-submit" onclick="sendData()">Опубликовать материал</button>
            <div id="status"></div>
        </div>
    </div>

    <!-- Шаг 4. Управление материалами -->
    <div class="bento-card span-2">
        <div class="form-group">
            <label>Управление материалами</label>
            <button class="button-load" onclick="loadArticles()">Загрузить список статей</button>
            <div class="article-list" id="articleList">
                <!-- Здесь будут появляться статьи -->
            </div>
        </div>
    </div>
</main>

<script>
    // ВАЖНО: ЗАМЕНИТЕ НА ВАШУ ССЫЛКУ ИЗ ОБЛАКА
    const API_URL = 'https://functions.yandexcloud.net/d4ecn5ag33dcdd2deivd';

    function toggleTheme() {
        const body = document.documentElement;
        const btn = document.getElementById('themeBtn');
        
        if (body.getAttribute('data-theme') === 'dark') {
            body.removeAttribute('data-theme');
            btn.innerHTML = 'Включить тень 🌙';
        } else {
            body.setAttribute('data-theme', 'dark');
            btn.innerHTML = 'Включить свет ☀️';
        }
    }

    // Имитация загрузки файла до настройки Cloud Storage
    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (file) {
            const label = document.getElementById('upload-label');
            const coverInput = document.getElementById('cover');
            
            label.innerText = '⏳ Загрузка: ' + file.name + '...';
            
            // Имитируем процесс загрузки (в будущем здесь будет реальный запрос к Яндексу)
            setTimeout(() => {
                label.innerText = '✅ Фото загружено';
                coverInput.value = 'https://storage.yandexcloud.net/lesovik-media/' + file.name.replace(/\s+/g, '-').toLowerCase();
            }, 1000);
        }
    }

    async function sendData() {
        const statusDiv = document.getElementById('status');
        const data = {
            action: 'create', // Метка действия для функции (создание)
            title: document.getElementById('title').value,
            slug: document.getElementById('slug').value,
            content: document.getElementById('content').value,
            cover_image_url: document.getElementById('cover').value, // Возвращено фото
            rutube_iframe: document.getElementById('rutube').value, // Возвращено видео
            is_published: true
        };

        statusDiv.style.display = 'block';
        statusDiv.className = 'status-loading';
        statusDiv.innerText = 'Подключение к YDB...';

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify(data)
            });

            const result = await response.json();
            
            if (result.status === 'success') {
                statusDiv.className = 'status-success';
                statusDiv.innerText = 'Материал успешно загружен в базу.';
                
                // Очистка всех полей формы после успеха
                document.getElementById('title').value = '';
                document.getElementById('slug').value = '';
                document.getElementById('content').value = '';
                document.getElementById('cover').value = '';
                document.getElementById('rutube').value = '';
                document.getElementById('upload-label').innerText = '📁 Выбрать фото на компьютере';
                
                // Автоматически обновляем список статей
                loadArticles();
            } else {
                throw new Error(result.error);
            }
        } catch (error) {
            statusDiv.className = 'status-error';
            statusDiv.innerText = 'Системная ошибка: ' + error.message;
        }
    }

    // Загрузка статей из базы (потребует обновления Cloud Function)
    async function loadArticles() {
        const listDiv = document.getElementById('articleList');
        listDiv.innerHTML = '<p style="font-size: 14px; color: var(--text-color);">Загрузка данных...</p>';
        
        try {
            // Отправляем запрос на получение списка
            const response = await fetch(API_URL + '?action=list', { method: 'GET' });
            const data = await response.json();
            
            if (data.articles && data.articles.length > 0) {
                listDiv.innerHTML = '';
                data.articles.forEach(article => {
                    listDiv.innerHTML += `
                        <div class="article-item" id="art-${article.id}">
                            <span class="article-title">${article.title}</span>
                            <button class="btn-delete" onclick="deleteArticle('${article.id}')">🗑 Удалить</button>
                        </div>
                    `;
                });
            } else {
                listDiv.innerHTML = '<p style="font-size: 14px; color: var(--text-color);">Статей пока нет.</p>';
            }
        } catch (error) {
            listDiv.innerHTML = '<p style="font-size: 14px; color: #DC2626;">Нужно обновить код Яндекс Функции для вывода списка.</p>';
        }
    }

    // Удаление статьи (потребует обновления Cloud Function)
    async function deleteArticle(id) {
        if(!confirm('Точно удалить эту статью?')) return;
        
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'delete', id: id })
            });
            const result = await response.json();
            
            if (result.status === 'success') {
                document.getElementById(`art-${id}`).remove();
            } else {
                alert('Ошибка: ' + result.error);
            }
        } catch (error) {
            alert('Ошибка удаления. Проверьте Cloud Function.');
        }
    }
</script>

</body>
</html>
