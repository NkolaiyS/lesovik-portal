<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лесовик — Панель управления</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌲</text></svg>">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Inter:wght@400;500;600&display=swap');

        :root {
            --bg-color: #F9FBF9;
            --text-color: #333333;
            --accent-primary: #2D5A27;
            --accent-secondary: #8FBC8F;
            --accent-light: #E3F2FD;
            --card-bg: #FFFFFF;
            --border-color: #E0E0E0;
            --input-bg: #FFFFFF;
            --glass-bg: rgba(249, 251, 249, 0.85);
            --glass-border: rgba(45, 90, 39, 0.1);
            --radius-strict: 8px; 
            --danger-color: #DC2626;
        }

        [data-theme="dark"] {
            --bg-color: #1A2421;
            --text-color: #F9FBF9;
            --accent-primary: #8FBC8F;
            --accent-secondary: #2D5A27;
            --accent-light: #2A3B32;
            --card-bg: #22302B;
            --border-color: #3A4F46;
            --input-bg: #1A2421;
            --glass-bg: rgba(26, 36, 33, 0.85);
            --glass-border: rgba(143, 188, 143, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .glass-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-svg {
            width: 28px;
            height: 28px;
            fill: var(--accent-primary);
        }

        .glass-header h1 {
            font-family: 'Merriweather', serif;
            color: var(--accent-primary);
            margin: 0;
            font-size: 22px;
        }

        .theme-toggle {
            background: transparent;
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
            padding: 10px 20px;
            border-radius: var(--radius-strict);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 14px;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .bento-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-strict);
            padding: 24px;
        }

        .span-2 { grid-column: span 2; }

        .form-group {
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: center;
        }

        label {
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            color: var(--accent-primary);
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-strict);
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 15px;
        }

        textarea {
            min-height: 250px;
            resize: vertical;
        }

        .button-submit, .button-load {
            background-color: var(--accent-primary);
            color: var(--bg-color);
            border: none;
            padding: 16px 32px;
            border-radius: var(--radius-strict);
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
        }

        .button-load {
            background-color: transparent;
            color: var(--accent-primary);
            border: 1px solid var(--accent-primary);
            padding: 10px 20px;
            font-size: 14px;
        }

        /* Стили для списка статей */
        .article-list {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .article-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-strict);
        }

        .article-title {
            font-weight: 500;
            font-size: 15px;
        }

        .btn-delete {
            background-color: #FEE2E2;
            color: var(--danger-color);
            border: 1px solid #F87171;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .btn-delete:hover { background-color: var(--danger-color); color: #fff; }

        #status {
            margin-top: 16px;
            padding: 16px;
            display: none;
            border-radius: var(--radius-strict);
            font-weight: 500;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header class="glass-header">
    <div class="logo-container">
        <svg class="logo-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L1 21H23L12 2ZM12 6.88L18.17 17.5H5.83L12 6.88Z"/>
            <rect x="10.5" y="20" width="3" height="4"/>
        </svg>
        <h1>Лесовик</h1>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">Включить тень 🌙</button>
</header>

<main class="bento-grid">
    <!-- Шаг 1. Основные тексты -->
    <div class="bento-card">
        <div class="form-group">
            <label>Основной заголовок</label>
            <input type="text" id="title" placeholder="Особенности таксации...">
        </div>
    </div>

    <div class="bento-card">
        <div class="form-group">
            <label>Адрес страницы (slug)</label>
            <input type="text" id="slug" placeholder="taksaciya-lesov">
        </div>
    </div>

    <div class="bento-card span-2">
        <div class="form-group">
            <label>Текст статьи (HTML)</label>
            <textarea id="content" placeholder="<p>Введение в тему...</p>"></textarea>
        </div>
    </div>

    <!-- Шаг 2. Публикация -->
    <div class="bento-card span-2">
        <div class="form-group">
            <button class="button-submit" onclick="sendData()">Опубликовать материал</button>
            <div id="status"></div>
        </div>
    </div>

    <!-- Шаг 3. Управление (Новый блок) -->
    <div class="bento-card span-2">
        <div class="form-group">
            <label>Управление материалами</label>
            <button class="button-load" onclick="loadArticles()">Загрузить список статей</button>
            <div class="article-list" id="articleList">
                <!-- Здесь будут появляться статьи -->
            </div>
        </div>
    </div>
</main>

<script>
    // ВАЖНО: ЗАМЕНИТЕ НА ВАШУ ССЫЛКУ ИЗ ОБЛАКА
    const API_URL = 'https://functions.yandexcloud.net/d4ecn5ag33dcdd2deivd';

    function toggleTheme() {
        const body = document.documentElement;
        const btn = document.getElementById('themeBtn');
        if (body.getAttribute('data-theme') === 'dark') {
            body.removeAttribute('data-theme');
            btn.innerHTML = 'Включить тень 🌙';
        } else {
            body.setAttribute('data-theme', 'dark');
            btn.innerHTML = 'Включить свет ☀️';
        }
    }

    async function sendData() {
        const statusDiv = document.getElementById('status');
        const data = {
            action: 'create', // Добавили метку действия для функции
            title: document.getElementById('title').value,
            slug: document.getElementById('slug').value,
            content: document.getElementById('content').value,
            is_published: true
        };

        statusDiv.style.display = 'block';
        statusDiv.innerText = 'Подключение к YDB...';

        try {
            const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify(data) });
            const result = await response.json();
            if (result.status === 'success') {
                statusDiv.innerText = 'Успех!';
                document.getElementById('title').value = '';
                document.getElementById('slug').value = '';
                document.getElementById('content').value = '';
                loadArticles(); // Обновляем список
            }
        } catch (error) {
            statusDiv.innerText = 'Ошибка: ' + error.message;
        }
    }

    // Загрузка статей из базы (потребует обновления Cloud Function)
    async function loadArticles() {
        const listDiv = document.getElementById('articleList');
        listDiv.innerHTML = '<p style="font-size: 14px;">Загрузка данных...</p>';
        
        try {
            // Отправляем запрос на получение списка
            const response = await fetch(API_URL + '?action=list', { method: 'GET' });
            const data = await response.json();
            
            if (data.articles && data.articles.length > 0) {
                listDiv.innerHTML = '';
                data.articles.forEach(article => {
                    listDiv.innerHTML += `
                        <div class="article-item" id="art-${article.id}">
                            <span class="article-title">${article.title}</span>
                            <button class="btn-delete" onclick="deleteArticle('${article.id}')">🗑 Удалить</button>
                        </div>
                    `;
                });
            } else {
                listDiv.innerHTML = '<p style="font-size: 14px;">Статей пока нет.</p>';
            }
        } catch (error) {
            listDiv.innerHTML = '<p style="font-size: 14px; color: red;">Нужно обновить код Яндекс Функции для вывода списка.</p>';
        }
    }

    // Удаление статьи (потребует обновления Cloud Function)
    async function deleteArticle(id) {
        if(!confirm('Точно удалить эту статью?')) return;
        
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'delete', id: id })
            });
            const result = await response.json();
            
            if (result.status === 'success') {
                document.getElementById(`art-${id}`).remove();
            }
        } catch (error) {
            alert('Ошибка удаления. Проверьте Cloud Function.');
        }
    }
</script>

</body>
</html>
